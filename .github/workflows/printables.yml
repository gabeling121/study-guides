# Remakes the printable PDFs in the cloud whenever a study guide changes.
# PDFs are listed per guide under "printables" in docs/apps.json.
name: Make printables
on:
  push:
    branches: [main]
    paths: ["docs/**", "tools/print/**", "!docs/**/printables/**"]
  workflow_dispatch:
    inputs:
      guides:
        description: "Guide ids to remake (blank = all)"
        required: false
permissions:
  contents: write
concurrency: printables
jobs:
  pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Work out which guides changed
        id: which
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ids=${{ github.event.inputs.guides }}" >> "$GITHUB_OUTPUT"
            echo "run=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then before=$(git rev-list --max-parents=0 HEAD); fi
          ids=$(git diff --name-only "$before" "${{ github.sha }}" -- docs \
                | grep -v '/printables/' | awk -F/ 'NF>=4 {print $3}' | sort -u | tr '\n' ' ')
          run=yes
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(tools/print/|docs/apps.json)'; then ids=""   # remake all
          elif [ -z "${ids// /}" ]; then run=no; fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Run: $run  Guides: ${ids:-all}"
      - name: Make PDFs
        if: steps.which.outputs.run == 'yes'
        run: python3 tools/print/make_printables.py ${{ steps.which.outputs.ids }}
      - name: Save PDFs to the repo
        if: steps.which.outputs.run == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*/*/printables
          if git diff --cached --quiet; then echo "No PDF changes"; exit 0; fi
          git commit -m "Update printables"
          git push
